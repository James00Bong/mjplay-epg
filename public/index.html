<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MJ Play Guide Status</title><style>body{background:#0d1423;color:#eef3ff;font:18px system-ui;max-width:850px;margin:8vh auto;padding:24px}h1{font-size:38px}a{color:#a4c5ff}pre{white-space:pre-wrap;color:#bac8df}</style><h1>MJ Play programme guide</h1><p>Public TV schedules. No video streams or personal viewing data.</p><p id="state">Checking guide freshness…</p><pre id="detail"></pre><p><a href="status.json">Refresh report</a> · <a href="manifest.json">Channel manifest</a></p><script>fetch("status.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(s=>{document.getElementById("state").textContent=Date.now()-s.generatedAt<12*3600000?"Guide refresh is current":"Guide refresh needs attention";document.getElementById("detail").textContent=[s.available+" of "+s.total+" configured channels available","Last refresh: "+new Date(s.generatedAt).toLocaleString(),"Refresh target: every six hours"].join(String.fromCharCode(10));}).catch(()=>document.getElementById("state").textContent="No refresh report is available yet");</script></html>
