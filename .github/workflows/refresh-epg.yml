name: Refresh and publish EPG
on:
  push:
    branches: [main]
    paths: ['refresh.mjs', 'channels.json', '.github/workflows/refresh-epg.yml', 'public/index.html']
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: epg-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh verified channel guides
        run: node refresh.mjs
      - name: Preserve current guides for upstream outages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/guides public/status.json public/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh guide data [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish schedules
        id: deployment
        uses: actions/deploy-pages@v4
